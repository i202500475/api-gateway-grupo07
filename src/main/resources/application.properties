spring.application.name=api-gateway-grupo07
server.port=8070

# ---------- Registro en Eureka ----------
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# ---------- Rutas (balanceo de carga lb:// via Eureka) ----------
spring.cloud.gateway.server.webflux.routes[0].id=solicitud-service-grupo07
spring.cloud.gateway.server.webflux.routes[0].uri=lb://SOLICITUD-SERVICE-GRUPO07
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/solicitudes/**

spring.cloud.gateway.server.webflux.routes[1].id=evaluacion-service-grupo07
spring.cloud.gateway.server.webflux.routes[1].uri=lb://EVALUACION-SERVICE-GRUPO07
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/evaluaciones/**
